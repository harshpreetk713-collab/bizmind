
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BizMind | Business Intelligence</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #172554;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px 8%;
            background: white;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #1746a2;
        }

        nav a {
            color: #1746a2;
            text-decoration: none;
            font-weight: bold;
        }

        .hero {
            min-height: 75vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .hero h1 {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .hero h1 span {
            color: #2563eb;
        }

        .hero p {
            font-size: 19px;
            color: #64748b;
            margin-bottom: 30px;
            line-height: 1.7;
        }

        .btn {
            background: #2563eb;
            color: white;
            padding: 16px 30px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">BizMind.</div>
        <a href="/dashboard">Dashboard</a>
    </nav>

    <section class="hero">
        <h1>Connect. <span>Analyse.</span> Grow.</h1>

        <p>
            Your cloud-based business intelligence platform.<br>
            Connect your business data, understand your performance,<br>
            and make smarter business decisions.
        </p>

        <a href="/dashboard" class="btn">
            Explore Dashboard →
        </a>
    </section>

    <footer>
        © 2026 BizMind | Cloud-Based Business Intelligence Platform
    </footer>

</body>
</html>
